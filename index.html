<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONLY CLEAN SERVICE</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1b2433;--mut:#5d6778;--b1:#0b2a6b;--b2:#4f8fd6;--gr:#e3e7ee;--ln:#d5dbe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181f;--card:#1e2430;--tx:#eef1f6;--mut:#a3adbd;--b1:#7fb0f0;--b2:#4f8fd6;--gr:#2a3140;--ln:#343c4d}}
:root[data-theme=dark]{--bg:#14181f;--card:#1e2430;--tx:#eef1f6;--mut:#a3adbd;--b1:#7fb0f0;--b2:#4f8fd6;--gr:#2a3140;--ln:#343c4d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
section{padding:40px 18px;max-width:960px;margin:auto}
h2{color:var(--b1);margin:0 0 6px;font-size:1.6rem}.sub{color:var(--mut);margin:0 0 20px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
header img{height:42px;border-radius:6px}
.btn{background:var(--b2);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--gr);color:var(--tx)}.btn:disabled{opacity:.4}
.lang button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 10px;cursor:pointer}
.lang button.on{background:var(--b1);color:var(--bg)}
.hero{text-align:center;background:linear-gradient(160deg,#0b2a6b,#4f8fd6);color:#fff;padding:36px 18px}
.hero img{width:min(300px,80%);border-radius:14px}.hero h1{margin:14px 0 6px;font-size:1.7rem}.hero p{margin:0 auto 18px;max-width:520px;opacity:.95}
.wa{background:#25d366;color:#04361a}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.card .ic{font-size:2rem}.card h3{margin:6px 0 2px;color:var(--b1);font-size:1.05rem}.card p{margin:0;color:var(--mut);font-size:.92rem}
.svc{cursor:pointer;text-align:left;font:inherit;color:inherit}.svc:hover,.svc.sel{border-color:var(--b2);box-shadow:0 0 0 2px var(--b2)}
.promo{background:#0b2a6b;color:#fff;text-align:center;border-radius:18px;padding:22px}.promo h3{margin:0 0 12px;font-size:1.2rem}.promo .btn{background:#fff;color:#0b2a6b}
.steps{display:flex;gap:4px;margin:0 0 16px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--gr)}.steps i.on{background:var(--b2)}
.qty{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0}.qty button{width:52px;height:52px;border-radius:50%;border:0;background:var(--b2);color:#fff;font-size:1.6rem;cursor:pointer}.qty b{font-size:2.2rem;min-width:50px;text-align:center}
.tot{font-size:1.5rem;font-weight:700;color:var(--b1);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{padding:10px 0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
.cal button.on{background:var(--b2);color:#fff}.cal button:disabled{opacity:.3}.cal small{color:var(--mut)}
.hrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hrs button{flex:1;min-width:64px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}.hrs button.on{background:var(--b2);color:#fff}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.rc{border:2px dashed var(--ln);border-radius:14px;padding:14px}.rc div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln);gap:10px}.rc div:last-child{border:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal{grid-template-columns:repeat(2,1fr)!important}@media(min-width:700px){.gal{grid-template-columns:repeat(4,1fr)!important}}.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;cursor:zoom-in}#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;align-items:center;justify-content:center;padding:12px}#lb img{max-width:100%;max-height:100%;border-radius:8px}
.st{color:#f5b301;font-size:1.3rem;letter-spacing:2px}.pick span{cursor:pointer;font-size:2rem;color:var(--ln)}.pick span.on{color:#f5b301}
footer{background:#0b2a6b;color:#fff;text-align:center;padding:26px 16px}footer a{color:#fff}
#prev{max-width:140px;border-radius:10px;margin-top:6px}
#adm{display:none}
</style></head><body>

function showGal(){const all=STATIC.concat(gal);$("gal").innerHTML=all.map(u=>`<img loading="lazy" src="${u}" alt="Only Clean">`).join("");$("galEmpty").style.display="none";$("gal").querySelectorAll("img").forEach(i=>i.onclick=()=>{$("lbi").src=i.src;$("lb").style.display="flex"})}
$("lb").onclick=()=>{$("lb").style.display="none"};showGal();
$("gup").onchange=async e=>{if(!asst||!db){alert(L=="fr"?"Ajout impossible : ouvrez le site connecté à votre compte Claude (propriétaire).":"Upload unavailable: open the site while signed in to your Claude account (owner).");return}
 for(const f of e.target.files){try{const a=await asst.upload(f);gal.push(a.url);await db.doc("gallery/main").set({urls:gal});showGal()}catch(x){alert((L=="fr"?"Erreur : ":"Error: ")+((x&&(x.message||x.code))||x))}}e.target.value=""};
lang("fr");pick();
(async()=>{try{const u=await claude.use("user");if(u&&(u.isOwner()||u.canEdit()))$("adm").style.display="block";
 db=await claude.use("db");asst=await claude.use("assets");
 if(db){db.doc("gallery/main").onSnapshot(s=>{gal=(s.data()||{}).urls||[];showGal()});
  db.collection("reviews").onSnapshot(s=>{revs=s.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);showRev()})}}catch(e){}})();
